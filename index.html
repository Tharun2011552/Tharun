<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101522">
<title>Nova AI - Your AI Assistant</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #101522;
    --panel: #171e2e;
    --panel2: #202a3d;
    --text: #f4f7ff;
    --muted: #97a4bd;
    --accent: #8175ff;
    --border: #30394c;
}

body.light {
    --bg: #f3f5fb;
    --panel: #ffffff;
    --panel2: #eef0fa;
    --text: #20253a;
    --muted: #707991;
    --border: #dfe3ef;
}

body {
    height: 100dvh;
    min-height: 500px;
    overflow: hidden;
    font-family: system-ui, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

.app {
    height: 100%;
    display: flex;
    flex-direction: column;
    max-width: 1000px;
    margin: auto;
    background: var(--bg);
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
}

.logo {
    width: 43px;
    height: 43px;
    display: grid;
    place-items: center;
    border-radius: 14px;
    font-size: 23px;
    background: linear-gradient(135deg, #8175ff, #41c9e8);
    color: white;
}

.brand h1 {
    font-size: 19px;
}

.brand p {
    color: var(--muted);
    font-size: 12px;
    margin-top: 2px;
}

.header-actions {
    display: flex;
    gap: 8px;
}

.icon-btn {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 40px;
    height: 40px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
}

main {
    flex: 1;
    overflow-y: auto;
    padding: 22px 15px;
    scroll-behavior: smooth;
}

.welcome {
    text-align: center;
    margin: 45px auto 28px;
    max-width: 500px;
}

.welcome-icon {
    font-size: 50px;
    margin-bottom: 15px;
}

.welcome h2 {
    font-size: clamp(25px, 5vw, 34px);
    margin-bottom: 12px;
    letter-spacing: -1px;
}

.gradient {
    background: linear-gradient(90deg, #a39aff, #48d2ed);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.welcome p {
    color: var(--muted);
    line-height: 1.7;
    font-size: 14px;
}

.suggestions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    max-width: 600px;
    margin: 25px auto;
}

.suggestion {
    padding: 15px 12px;
    text-align: left;
    border: 1px solid var(--border);
    border-radius: 15px;
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    line-height: 1.5;
    font-size: 13px;
}

.suggestion:hover {
    border-color: var(--accent);
}

.suggestion strong {
    display: block;
    margin-bottom: 4px;
    font-size: 14px;
}

#messages {
    max-width: 760px;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 23px;
}

.message {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    animation: appear .2s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}

.avatar {
    width: 35px;
    height: 35px;
    min-width: 35px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: var(--panel2);
    font-size: 17px;
}

.message.user .avatar {
    background: #5149a9;
    color: white;
}

.content {
    min-width: 0;
    flex: 1;
}

.name {
    font-size: 12px;
    color: var(--muted);
    margin: 2px 0 7px;
}

.bubble {
    line-height: 1.75;
    font-size: 14px;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.message.user .bubble {
    background: var(--panel2);
    padding: 11px 14px;
    border-radius: 4px 15px 15px 15px;
    display: inline-block;
    max-width: 100%;
}

.message-actions {
    display: flex;
    gap: 12px;
    margin-top: 8px;
}

.message-actions button {
    color: var(--muted);
    border: none;
    background: transparent;
    font-size: 12px;
    cursor: pointer;
    padding: 3px;
}

.typing {
    color: var(--muted);
    font-size: 13px;
}

.typing span {
    display: inline-block;
    animation: blink 1s infinite;
}

.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }

@keyframes blink {
    0%, 60%, 100% { opacity: .25; }
    30% { opacity: 1; }
}

footer {
    padding: 12px 15px 14px;
    border-top: 1px solid var(--border);
    background: var(--bg);
}

.composer {
    max-width: 760px;
    margin: auto;
    padding: 8px;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 8px 30px #00000010;
}

#prompt {
    flex: 1;
    min-width: 0;
    max-height: 130px;
    resize: none;
    padding: 10px 8px;
    background: transparent;
    color: var(--text);
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
}

#prompt::placeholder {
    color: var(--muted);
}

.send {
    width: 43px;
    height: 43px;
    flex-shrink: 0;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #8175ff, #5e8cff);
    color: white;
    font-size: 21px;
    cursor: pointer;
}

.send:disabled {
    opacity: .5;
}

.disclaimer {
    text-align: center;
    font-size: 10px;
    color: var(--muted);
    margin-top: 10px;
}

@media (max-width: 450px) {
    header { padding: 12px; }
    .brand h1 { font-size: 17px; }
    .welcome { margin-top: 28px; }
    main { padding: 15px 12px; }
    .suggestion { padding: 12px 9px; }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="brand">
        <div class="logo">✦</div>
        <div>
            <h1>Nova AI</h1>
            <p>✦ Your intelligent assistant</p>
        </div>
    </div>

    <div class="header-actions">
        <button class="icon-btn" id="themeBtn"
                title="Change theme" aria-label="Change theme">☀</button>
        <button class="icon-btn" id="clearBtn"
                title="New chat" aria-label="New chat">＋</button>
    </div>
</header>

<main id="chat">
    <section class="welcome" id="welcome">
        <div class="welcome-icon">✦</div>
        <h2>What can I help <span class="gradient">you with?</span></h2>
        <p>
            Ask questions, learn something new, brainstorm ideas,
            or get help with your next project.
        </p>

        <div class="suggestions">
            <button class="suggestion" data-prompt="Explain artificial intelligence in simple words">
                <strong>🧠 Learn something</strong>
                Explain a difficult topic
            </button>

            <button class="suggestion" data-prompt="Give me a creative website project idea">
                <strong>💡 Get ideas</strong>
                Discover a new project
            </button>

            <button class="suggestion" data-prompt="Write a simple JavaScript program for beginners">
                <strong>💻 Write code</strong>
                Create a program
            </button>

            <button class="suggestion" data-prompt="Help me make a daily study timetable">
                <strong>📚 Study smarter</strong>
                Make a study timetable
            </button>
        </div>
    </section>

    <div id="messages"></div>
</main>

<footer>
    <form class="composer" id="chatForm">
        <textarea id="prompt" rows="1"
            placeholder="Message Nova AI..."
            aria-label="Message Nova AI"></textarea>
        <button class="send" id="sendBtn" type="submit"
            aria-label="Send message">↑</button>
    </form>
    <div class="disclaimer">
        Demo mode: responses are generated locally, not by a real AI model.
    </div>
</footer>

</div>

<script>
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const messages = document.getElementById("messages");
const promptBox = document.getElementById("prompt");
const chatForm = document.getElementById("chatForm");
const sendBtn = document.getElementById("sendBtn");

let previousAnswer = "";
let busy = false;

function scrollDown() {
    chat.scrollTop = chat.scrollHeight;
}

function addMessage(role, text, showCopy = false) {
    welcome.style.display = "none";

    const wrapper = document.createElement("div");
    wrapper.className = "message " + role;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "👤" : "✦";

    const content = document.createElement("div");
    content.className = "content";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = role === "user" ? "You" : "Nova AI";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    content.append(name, bubble);

    if (showCopy) {
        const actions = document.createElement("div");
        actions.className = "message-actions";

        const copyBtn = document.createElement("button");
        copyBtn.textContent = "▢ Copy";

        copyBtn.onclick = async () => {
            try {
                await navigator.clipboard.writeText(text);
                copyBtn.textContent = "✓ Copied";
            } catch {
                const area = document.createElement("textarea");
                area.value = text;
                document.body.appendChild(area);
                area.select();
                document.execCommand("copy");
                area.remove();
                copyBtn.textContent = "✓ Copied";
            }
        };

        actions.appendChild(copyBtn);
        content.appendChild(actions);
    }

    wrapper.append(avatar, content);
    messages.appendChild(wrapper);
    scrollDown();

    return wrapper;
}

function showTyping() {
    const row = addMessage("assistant", "");
    const bubble = row.querySelector(".bubble");
    bubble.className = "bubble typing";
    bubble.textContent = "Thinking ";

    const dots = document.createElement("span");
    dots.textContent = "● ● ●";
    bubble.appendChild(dots);

    return row;
}

// This is demo logic, not a genuine AI model.
function demoReply(question) {
    const q = question.toLowerCase().trim();

    if (/^(hi|hello|hey|namaste|ನಮಸ್ಕಾರ)\b/.test(q)) {
        return "Hello! 👋 Welcome to Nova AI. What would you like to explore today?";
    }

    if (q.includes("your name") || q.includes("who are you")) {
        return "I'm Nova AI, a chatbot website demo. I can show you how a chat assistant works. Connect an AI API to enable genuine AI-generated answers.";
    }

    if (q.includes("artificial intelligence") || q.includes("what is ai")) {
        return "Artificial intelligence (AI) is technology that allows computers to perform tasks such as understanding language, recognizing patterns, and generating text. Modern AI chatbots use trained models to respond to questions.";
    }

    if (q.includes("website") || q.includes("web development")) {
        return "Here are some website project ideas:\n\n1. AI chatbot\n2. Personal portfolio\n3. Online calculator\n4. Study planner\n5. Weather dashboard\n6. Quiz game\n\nYou can build the interface using HTML, CSS, and JavaScript.";
    }

    if (q.includes("javascript") || q.includes("programming") || q.includes("code")) {
        return "To learn programming, start with these steps:\n\n1. Learn HTML to structure a page.\n2. Learn CSS to style it.\n3. Learn JavaScript to add interactivity.\n4. Build small projects.\n5. Practice debugging and reading errors.\n\nTell me which project you want to build!";
    }

    if (q.includes("study") || q.includes("timetable")) {
        return "Here is a simple study routine:\n\n• 25 minutes: Study one topic.\n• 5 minutes: Take a break.\n• 25 minutes: Practice questions.\n• 10 minutes: Review what you learned.\n\nAdjust the routine to fit your subjects and schedule.";
    }

    if (q.includes("joke")) {
        return "Why do programmers prefer dark mode? Because light attracts bugs! 😄";
    }

    if (q.includes("thank")) {
        return "You're welcome! 😊 Feel free to ask me something else.";
    }

    if (q.includes("time")) {
        return "Your device's current time is " +
            new Date().toLocaleTimeString() +
            ". For other questions, remember that this is demo mode.";
    }

    return "Thanks for your message! 😊\n\nI'm currently running in demo mode, so I can't intelligently answer every question yet.\n\nTo make me a real AI chatbot, connect this website to an AI model through a secure backend API. Then I can generate answers to a much wider range of questions.";
}

async function sendMessage(text) {
    text = text.trim();

    if (!text || busy) return;

    busy = true;
    sendBtn.disabled = true;
    promptBox.value = "";
    promptBox.style.height = "auto";

    addMessage("user", text);

    const typing = showTyping();

    // Simulate a short response delay.
    await new Promise(resolve => setTimeout(resolve, 650));

    const answer = demoReply(text);
    typing.remove();

    addMessage("assistant", answer, true);
    previousAnswer = answer;

    busy = false;
    sendBtn.disabled = false;
    promptBox.focus();
}

chatForm.addEventListener("submit", event => {
    event.preventDefault();
    sendMessage(promptBox.value);
});

promptBox.addEventListener("input", () => {
    promptBox.style.height = "auto";
    promptBox.style.height =
        Math.min(promptBox.scrollHeight, 130) + "px";
});

promptBox.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        chatForm.requestSubmit();
    }
});

document.querySelectorAll(".suggestion").forEach(button => {
    button.addEventListener("click", () => {
        sendMessage(button.dataset.prompt);
    });
});

document.getElementById("clearBtn").addEventListener("click", () => {
    messages.replaceChildren();
    welcome.style.display = "";
    promptBox.value = "";
    previousAnswer = "";
    chat.scrollTop = 0;
});

document.getElementById("themeBtn").addEventListener("click", () => {
    document.body.classList.toggle("light");
    document.getElementById("themeBtn").textContent =
        document.body.classList.contains("light") ? "☾" : "☀";
});
</script>

</body>
</html>
