<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101426">

<title>Web Calculator</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #101426, #252c50);
    font-family: Arial, sans-serif;
    padding: 20px;
}

.calculator {
    width: 100%;
    max-width: 360px;
    padding: 25px;
    border-radius: 25px;
    background: #171c32;
    box-shadow: 0 15px 40px #0008;
}

h2 {
    color: white;
    text-align: center;
    margin-bottom: 20px;
    letter-spacing: 2px;
}

.display {
    width: 100%;
    min-height: 95px;
    background: #0d1121;
    color: white;
    border-radius: 15px;
    margin-bottom: 20px;
    padding: 15px;
    text-align: right;
    overflow: hidden;
    overflow-wrap: anywhere;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
}

#history {
    color: #8992b7;
    font-size: 15px;
    min-height: 20px;
}

#result {
    font-size: 34px;
    margin-top: 8px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 60px;
    border: none;
    border-radius: 15px;
    background: #272e4a;
    color: white;
    font-size: 21px;
    cursor: pointer;
    transition: 0.15s;
    touch-action: manipulation;
}

button:active {
    transform: scale(0.94);
    filter: brightness(1.3);
}

.operator {
    background: #39456d;
    color: #9db5ff;
}

.clear {
    background: #ff526b;
    color: white;
}

.equal {
    background: #637bff;
    color: white;
    grid-row: span 2;
    height: auto;
}

.zero {
    grid-column: span 2;
}

footer {
    color: #8992b7;
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="calculator">

    <h2>CALCULATOR</h2>

    <div class="display">
        <div id="history"></div>
        <div id="result">0</div>
    </div>

    <div class="buttons">
        <button class="clear" onclick="clearAll()">AC</button>
        <button class="operator" onclick="deleteLast()">DEL</button>
        <button class="operator" onclick="add('%')">%</button>
        <button class="operator" onclick="add('/')">÷</button>

        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button class="operator" onclick="add('*')">×</button>

        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button class="operator" onclick="add('-')">−</button>

        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button class="operator" onclick="add('+')">+</button>

        <button class="zero" onclick="add('0')">0</button>
        <button onclick="add('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>

    <footer>Simple • Fast • Easy to Use</footer>

</div>

<script>
let expression = "";
let justCalculated = false;

const result = document.getElementById("result");
const history = document.getElementById("history");

function add(value) {
    const operators = ["+", "-", "*", "/", "%"];

    if (justCalculated) {
        if (operators.includes(value)) {
            // Continue calculating from the previous result.
        } else {
            expression = "";
            history.textContent = "";
        }
        justCalculated = false;
    }

    if (expression.length >= 100) return;

    expression += value;
    result.textContent = expression
        .replace(/\*/g, "×")
        .replace(/\//g, "÷");

    if (expression === "") {
        result.textContent = "0";
    }
}

function clearAll() {
    expression = "";
    result.textContent = "0";
    history.textContent = "";
    justCalculated = false;
}

function deleteLast() {
    expression = expression.slice(0, -1);
    result.textContent = expression
        ? expression.replace(/\*/g, "×").replace(/\//g, "÷")
        : "0";
    justCalculated = false;
}

function calculate() {
    if (!expression) return;

    try {
        // Accept only calculator characters.
        if (!/^[0-9+\-*/%.()\s]+$/.test(expression)) {
            throw new Error("Invalid expression");
        }

        const original = expression;
        const answer = Function(
            '"use strict"; return (' + expression + ')'
        )();

        if (typeof answer !== "number" || !Number.isFinite(answer)) {
            throw new Error("Invalid result");
        }

        history.textContent = original
            .replace(/\*/g, "×")
            .replace(/\//g, "÷") + " =";

        expression = String(
            Number(answer.toPrecision(12))
        );

        result.textContent = expression;
        justCalculated = true;

    } catch (error) {
        result.textContent = "Error";
        expression = "";
        justCalculated = false;
    }
}

// Keyboard support for computers
document.addEventListener("keydown", function(event) {
    const key = event.key;

    if (/^[0-9.+\-*/%()]$/.test(key)) {
        add(key);
    } else if (key === "Enter" || key === "=") {
        calculate();
    } else if (key === "Backspace") {
        deleteLast();
    } else if (key === "Escape") {
        clearAll();
    }
});
</script>

</body>
</html>
