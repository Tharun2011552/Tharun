<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4f7ff">
<title>QuizQuest - Quiz Challenge</title>
<style>
*{box-sizing:border-box}
:root{--primary:#5b5ce2;--background:#f4f7ff;--text:#20243a;--muted:#777d91;--card:#fff}
body{margin:0;min-height:100vh;padding:20px 14px;font-family:Arial,sans-serif;background:var(--background);color:var(--text);display:flex;justify-content:center;align-items:center}
.container{width:100%;max-width:520px}
.header{text-align:center;margin-bottom:22px}
.logo{font-size:40px}
.header h1{margin:8px 0;font-size:30px}
.header h1 span{color:var(--primary)}
.header p{color:var(--muted);margin:0;line-height:1.5}
.card{background:var(--card);border-radius:22px;padding:23px;box-shadow:0 10px 35px #25356b12}
.stats{display:flex;justify-content:space-between;gap:10px;margin-bottom:22px}
.stat{background:#f4f5ff;padding:11px;border-radius:12px;flex:1;text-align:center}
.stat small{display:block;color:var(--muted);margin-bottom:5px}
.stat strong{font-size:18px}
.progress-info{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-bottom:8px}
.progress-bar{height:8px;background:#e9eafa;border-radius:10px;overflow:hidden;margin-bottom:24px}
.progress{height:100%;width:0%;background:var(--primary);transition:width .3s}
.category{display:inline-block;color:var(--primary);background:#efefff;padding:7px 12px;border-radius:20px;font-size:12px;font-weight:bold;margin-bottom:12px}
#question{font-size:22px;line-height:1.4;margin:0 0 20px}
.answers{display:grid;gap:11px}
.answer{width:100%;padding:15px;border:2px solid #e7e9f2;border-radius:13px;background:#fff;text-align:left;font-size:15px;color:var(--text);cursor:pointer;transition:.2s}
.answer:active{transform:scale(.98)}
.answer:hover:not(:disabled){border-color:var(--primary);background:#f8f8ff}
.answer.correct{background:#e7f9ee;border-color:#28a960;color:#16723c}
.answer.wrong{background:#fff0ef;border-color:#ed6868;color:#b72d2d}
.answer:disabled{cursor:default}
.feedback{min-height:25px;margin:15px 0 5px;font-size:14px;font-weight:bold}
.actions{display:flex;gap:10px;margin-top:14px}
.btn{border:none;padding:14px 18px;border-radius:12px;font-size:15px;font-weight:bold;cursor:pointer}
.primary{background:var(--primary);color:#fff;flex:1}
.primary:hover{background:#4849c5}
.secondary{background:#eeeefe;color:var(--primary)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}
.result{text-align:center;padding:15px 0 5px}
.result-emoji{font-size:65px}
.result h2{font-size:28px;margin:12px 0}
.result p{color:var(--muted);line-height:1.6}
.final-score{font-size:46px;color:var(--primary);font-weight:bold;margin:20px 0 5px}
.result-details{display:flex;justify-content:center;gap:12px;margin:20px 0}
.result-box{flex:1;padding:15px 5px;background:#f4f5ff;border-radius:12px}
.result-box strong{display:block;font-size:22px;margin-bottom:5px}
.result-box small{color:var(--muted)}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
@media(max-width:380px){.card{padding:17px}#question{font-size:19px}.header h1{font-size:26px}}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="logo">🧠</div>
    <h1>Quiz<span>Quest</span></h1>
    <p>Challenge your mind. Beat your best score!</p>
  </header>
  <main class="card">
    <section id="gameScreen">
      <div class="stats">
        <div class="stat"><small>🏆 Score</small><strong id="score">0</strong></div>
        <div class="stat"><small>⏱ Time</small><strong id="timer">15s</strong></div>
        <div class="stat"><small>🔥 Streak</small><strong id="streak">0</strong></div>
      </div>
      <div class="progress-info"><span id="questionCount">Question 1 of 10</span><span id="percent">0% completed</span></div>
      <div class="progress-bar"><div class="progress" id="progress"></div></div>
      <div class="category" id="category">GENERAL KNOWLEDGE</div>
      <h2 id="question">Loading question...</h2>
      <div class="answers" id="answers"></div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <div class="actions">
        <button class="btn secondary" id="quitBtn">Quit</button>
        <button class="btn primary" id="nextBtn" disabled>Next Question →</button>
      </div>
    </section>
    <section id="resultScreen" class="result hidden">
      <div class="result-emoji" id="resultEmoji">🏆</div>
      <h2 id="resultTitle">Amazing job!</h2>
      <p id="resultMessage">You completed the challenge.</p>
      <div class="final-score" id="finalScore">0/10</div>
      <p>Your final score</p>
      <div class="result-details">
        <div class="result-box"><strong id="correctCount">0</strong><small>Correct</small></div>
        <div class="result-box"><strong id="wrongCount">0</strong><small>Incorrect</small></div>
        <div class="result-box"><strong id="accuracy">0%</strong><small>Accuracy</small></div>
      </div>
      <button class="btn primary" id="restartBtn" style="width:100%">🔄 Play Again</button>
    </section>
  </main>
  <footer class="footer">Made with ❤️ for curious minds</footer>
</div>

const $ = id => document.getElementById(id);
let quiz = [];
let current = 0;
let score = 0;
let streak = 0;
let correct = 0;
let wrong = 0;
let timeLeft = 15;
let timerId = null;
let answered = false;
let bestScore = 0;

try {
  bestScore = Number(localStorage.getItem("quizQuestBest")) || 0;
} catch (error) {
  bestScore = 0;
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function startGame() {
  clearInterval(timerId);
  current = 0;
  score = 0;
  streak = 0;
  correct = 0;
  wrong = 0;
  quiz = shuffle([...questionBank]).slice(0, 10);

  $("gameScreen").classList.remove("hidden");
  $("resultScreen").classList.add("hidden");
  $("score").textContent = score;
  $("streak").textContent = streak;
  showQuestion();
}

function showQuestion() {
  clearInterval(timerId);
  if (current >= quiz.length) {
    endGame();
    return;
  }

  answered = false;
  timeLeft = 15;
  const q = quiz[current];

  $("questionCount").textContent = `Question ${current + 1} of ${quiz.length}`;
  $("percent").textContent = `${Math.round(current / quiz.length * 100)}% completed`;
  $("progress").style.width = `${current / quiz.length * 100}%`;
  $("category").textContent = q.category;
  $("question").textContent = q.question;
  $("timer").textContent = `${timeLeft}s`;
  $("timer").style.color = "var(--text)";
  $("feedback").textContent = "";
  $("nextBtn").disabled = true;
  $("nextBtn").textContent = current === quiz.length - 1 ? "See Results 🏆" : "Next Question →";

  const box = $("answers");
  box.replaceChildren();

  q.options.forEach((option, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "answer";
    button.textContent = `${String.fromCharCode(65 + index)}. ${option}`;
    button.addEventListener("click", () => selectAnswer(index));
    box.appendChild(button);
  });

  timerId = setInterval(() => {
    if (answered) return;
    timeLeft--;
    $("timer").textContent = `${timeLeft}s`;
    if (timeLeft <= 5) $("timer").style.color = "#e34d4d";
    if (timeLeft <= 0) selectAnswer(-1);
  }, 1000);
}

function selectAnswer(selected) {
  if (answered) return;
  answered = true;
  clearInterval(timerId);

  const q = quiz[current];
  const buttons = $("answers").querySelectorAll("button");
  buttons.forEach((button, index) => {
    button.disabled = true;
    if (index === q.answer) button.classList.add("correct");
  });

  if (selected === q.answer) {
    correct++;
    streak++;
    const points = 10 + timeLeft;
    score += points;
    $("feedback").textContent = `✅ Correct! +${points} points`;
    $("feedback").style.color = "#16804a";
  } else {
    wrong++;
    streak = 0;
    if (selected === -1) {
      $("feedback").textContent = "⏰ Time's up! The correct answer is highlighted.";
    } else {
      if (buttons[selected]) buttons[selected].classList.add("wrong");
      $("feedback").textContent = "❌ Not quite! The correct answer is highlighted.";
    }
    $("feedback").style.color = "#d13f3f";
  }

  $("score").textContent = score;
  $("streak").textContent = streak;
  $("nextBtn").disabled = false;
}

function endGame() {
  clearInterval(timerId);
  $("gameScreen").classList.add("hidden");
  $("resultScreen").classList.remove("hidden");
  $("progress").style.width = "100%";
  $("percent").textContent = "100% completed";
  $("finalScore").textContent = `${correct}/${quiz.length}`;
  $("correctCount").textContent = correct;
  $("wrongCount").textContent = wrong;

  const accuracy = Math.round(correct / quiz.length * 100);
  $("accuracy").textContent = `${accuracy}%`;

  if (accuracy === 100) {
    $("resultEmoji").textContent = "🏆";
    $("resultTitle").textContent = "Perfect Score!";
    $("resultMessage").textContent = "Incredible! You answered every question correctly.";
  } else if (accuracy >= 70) {
    $("resultEmoji").textContent = "🎉";
    $("resultTitle").textContent = "Great Job!";
    $("resultMessage").textContent = "Excellent work! Keep challenging your mind.";
  } else if (accuracy >= 40) {
    $("resultEmoji").textContent = "👏";
    $("resultTitle").textContent = "Good Effort!";
    $("resultMessage").textContent = "You're learning! Try again to improve your score.";
  } else {
    $("resultEmoji").textContent = "💪";
    $("resultTitle").textContent = "Keep Practicing!";
    $("resultMessage").textContent = "Every attempt makes you better. Give it another try!";
  }

  if (score > bestScore) {
    bestScore = score;
    try {
      localStorage.setItem("quizQuestBest", String(bestScore));
    } catch (error) {}
    $("resultMessage").textContent += " New personal best! 🥇";
  }
}

$("nextBtn").addEventListener("click", () => {
  if (answered) {
    current++;
    showQuestion();
  }
});

$("restartBtn").addEventListener("click", startGame);

$("quitBtn").addEventListener("click", () => {
  if (confirm("Are you sure you want to quit this game?")) {
    clearInterval(timerId);
    endGame();
  }
});
