].map(([category, question, options, answer]) => ({
  category, question, options, answer
}));

const $ = id => document.getElementById(id);

let quiz = [];
let current = 0;
let score = 0;
let streak = 0;
let correct = 0;
let wrong = 0;
let timeLeft = 15;
let timerId = null;
let answered = false;
let bestScore = 0;

try {
  bestScore = Number(localStorage.getItem("quizQuestBest")) || 0;
} catch (e) {}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function startGame() {
  clearInterval(timerId);

  current = 0;
  score = 0;
  streak = 0;
  correct = 0;
  wrong = 0;

  // Pick 10 different random questions for every new round.
  quiz = shuffle([...questionBank]).slice(0, 10);

  $("gameScreen").classList.remove("hidden");
  $("resultScreen").classList.add("hidden");
  $("score").textContent = "0";
  $("streak").textContent = "0";

  showQuestion();
}

function showQuestion() {
  clearInterval(timerId);

  if (current >= quiz.length) {
    endGame();
    return;
  }

  answered = false;
  timeLeft = 15;

  const q = quiz[current];

  $("questionCount").textContent =
    `Question ${current + 1} of ${quiz.length}`;
  $("percent").textContent =
    Math.round(current / quiz.length * 100) + "% completed";
  $("progress").style.width =
    current / quiz.length * 100 + "%";

  $("category").textContent = q.category;
  $("question").textContent = q.question;
  $("timer").textContent = timeLeft + "s";
  $("timer").style.color = "var(--text)";
  $("feedback").textContent = "";
  $("nextBtn").disabled = true;
  $("nextBtn").textContent =
    current === quiz.length - 1 ? "See Results 🏆" : "Next Question →";

  const box = $("answers");
  box.replaceChildren();

  q.options.forEach((option, index) => {
    const button = document.createElement("button");
    button.className = "answer";
    button.textContent =
      String.fromCharCode(65 + index) + ". " + option;
    button.addEventListener("click", () => selectAnswer(index));
    box.appendChild(button);
  });

  timerId = setInterval(() => {
    timeLeft--;
    $("timer").textContent = timeLeft + "s";

    if (timeLeft <= 5) $("timer").style.color = "#e34d4d";

    if (timeLeft <= 0) {
      clearInterval(timerId);
      selectAnswer(-1);
    }
  }, 1000);
}

function selectAnswer(selected) {
  if (answered) return;

  answered = true;
  clearInterval(timerId);

  const q = quiz[current];
  const buttons = $("answers").querySelectorAll("button");

  buttons.forEach((button, index) => {
    button.disabled = true;
    if (index === q.answer) button.classList.add("correct");
  });

  if (selected === q.answer) {
    correct++;
    streak++;
    const points = 10 + timeLeft;
    score += points;
    $("feedback").textContent = `✅ Correct! +${points} points`;
    $("feedback").style.color = "#16804a";
  } else {
    wrong++;
    streak = 0;

    if (selected === -1) {
      $("feedback").textContent =
        "⏰ Time's up! The correct answer is highlighted.";
    } else {
      buttons[selected].classList.add("wrong");
      $("feedback").textContent =
        "❌ Not quite! The correct answer is highlighted.";
    }

    $("feedback").style.color = "#d13f3f";
  }

  $("score").textContent = score;
  $("streak").textContent = streak;
  $("nextBtn").disabled = false;
}

function endGame() {
  clearInterval(timerId);

  $("gameScreen").classList.add("hidden");
  $("resultScreen").classList.remove("hidden");
  $("progress").style.width = "100%";

  $("finalScore").textContent = `${correct}/${quiz.length}`;
  $("correctCount").textContent = correct;
  $("wrongCount").textContent = wrong;

  const accuracy = Math.round(correct / quiz.length * 100);
  $("accuracy").textContent = accuracy + "%";

  if (accuracy === 100) {
    $("resultEmoji").textContent = "🏆";
    $("resultTitle").textContent = "Perfect Score!";
    $("resultMessage").textContent =
      "Incredible! You answered every question correctly.";
  } else if (accuracy >= 70) {
    $("resultEmoji").textContent = "🎉";
    $("resultTitle").textContent = "Great Job!";
    $("resultMessage").textContent =
      "Excellent work! Keep challenging your mind.";
  } else if (accuracy >= 40) {
    $("resultEmoji").textContent = "👏";
    $("resultTitle").textContent = "Good Effort!";
    $("resultMessage").textContent =
      "You're learning! Try again to improve your score.";
  } else {
    $("resultEmoji").textContent = "💪";
    $("resultTitle").textContent = "Keep Practicing!";
    $("resultMessage").textContent =
      "Every attempt makes you better. Give it another try!";
  }

  if (score > bestScore) {
    bestScore = score;
    try {
      localStorage.setItem("quizQuestBest", bestScore);
    } catch (e) {}
    $("resultMessage").textContent += " New personal best! 🥇";
  }
}

$("nextBtn").addEventListener("click", () => {
  if (answered) {
    current++;
    showQuestion();
  }
});

$("restartBtn").addEventListener("click", startGame);

$("quitBtn").addEventListener("click", () => {
  if (confirm("Are you sure you want to quit this game?")) {
    clearInterval(timerId);
    endGame();
  }
});

startGame();
</script>
